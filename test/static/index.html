<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autocomplete Stocks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    #results {
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      position: absolute;
      background-color: white;
      width: 300px;
    }
    .suggestion {
      padding: 8px;
      cursor: pointer;
    }
    .suggestion:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h2>Search Stocks</h2>
  <input type="text" id="search" placeholder="Type company name..." autocomplete="off" />
  <div id="results"></div>

  <script>
    const input = document.getElementById('search');
    const results = document.getElementById('results');

    input.addEventListener('input', async () => {
      const query = input.value.trim();
      if (query.length < 2) {
        results.innerHTML = '';
        return;
      }

      try {
        const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        results.innerHTML = '';
        (data.quotes || []).forEach(item => {
          const div = document.createElement('div');
          div.classList.add('suggestion');
          div.textContent = `${item.shortname || item.symbol} (${item.symbol})`;
          div.onclick = () => {
            input.value = item.symbol;
            results.innerHTML = '';
          };
          results.appendChild(div);
        });
      } catch (error) {
        console.error('Fetch error:', error);
        results.innerHTML = '<div class="suggestion">Error fetching data</div>';
      }
    });

    document.addEventListener('click', (e) => {
      if (!results.contains(e.target) && e.target !== input) {
        results.innerHTML = '';
      }
    });
  </script>
</body>
</html>
