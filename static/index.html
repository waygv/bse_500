<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSE TradingAgents Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #0d1117; color: #e6edf3; }
        .terminal-glow { box-shadow: 0 0 15px rgba(0, 255, 127, 0.1); }
        .agent-card { border: 1px solid #30363d; background-color: #161b22; transition: all 0.3s ease; cursor: pointer; }
        .agent-card:hover { border-color: #00ff7f; }
        .agent-card.expanded { max-height: none !important; position: fixed; top: 10%; left: 10%; right: 10%; bottom: 10%; z-index: 100; overflow-y: auto; padding: 2rem; border: 2px solid #00ff7f; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .tab-btn { font-size: 0.75rem; font-weight: 700; padding: 0.5rem 1rem; transition: all 0.2s; border-bottom: 2px solid transparent; color: #8b949e; text-transform: uppercase; }
        .tab-btn.active { border-color: #00ff7f; color: #ffffff; background-color: rgba(0, 255, 127, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0d1117; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        
        .prose-terminal h3 { color: #00ff7f; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; font-size: 0.85rem; border-bottom: 1px solid #30363d; padding-bottom: 2px; }
        .prose-terminal ul { list-style-type: none; padding-left: 0; }
        .prose-terminal li { position: relative; padding-left: 1.25rem; margin-bottom: 0.4rem; }
        .prose-terminal li::before { content: ">"; position: absolute; left: 0; color: #00ff7f; }
        .prose-terminal strong { color: #58a6ff; }
    </style>
</head>
<body class="p-4 md:p-6 overflow-x-hidden">
    <!-- Top Nav -->
    <header class="flex flex-col lg:flex-row justify-between items-center mb-8 gap-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-green-500 rounded flex items-center justify-center font-bold text-black text-xl">B</div>
            <h1 class="text-xl font-bold tracking-tighter">TRADING<span class="text-green-500">AGENTS</span> <span class="text-[10px] text-gray-500">BETA</span></h1>
        </div>
        
        <div class="relative w-full max-w-xl">
            <div class="flex gap-2">
                <input type="text" id="ticker-search" placeholder="Search Ticker (e.g. RELIANCE)..." 
                       class="w-full bg-[#161b22] border border-[#30363d] rounded py-2 px-5 focus:outline-none focus:border-green-500 text-sm">
                <button onclick="triggerManualSearch()" class="bg-green-500 text-black px-5 rounded font-bold hover:bg-green-400 text-xs">ANALYZE</button>
            </div>
            <div id="search-results" class="absolute top-full left-0 right-0 bg-[#161b22] border border-[#30363d] rounded-b mt-1 hidden z-50 shadow-2xl"></div>
        </div>

        <div class="flex bg-[#161b22] rounded p-1 border border-[#30363d]">
            <button id="btn-dash" onclick="showView('dashboard')" class="tab-btn active">Market</button>
            <button id="btn-arena" onclick="showView('arena')" class="tab-btn">Arena</button>
            <button id="btn-reports" onclick="showView('reports')" class="tab-btn">Reports</button>
        </div>
    </header>

    <main>
        <!-- Dashboard View -->
        <section id="view-dashboard" class="space-y-6 animate-fade-in">
            <div id="heatmap-error" class="hidden p-4 bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 rounded text-center text-xs">
                Market data sync in progress. Heatmaps will load automatically...
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <div class="bg-[#161b22] rounded-xl p-4 border border-[#30363d] min-h-[500px]">
                    <div id="index-heatmap" class="w-full h-full"></div>
                </div>
                <div class="bg-[#161b22] rounded-xl p-4 border border-[#30363d] min-h-[500px]">
                    <div id="market-heatmap" class="w-full h-full"></div>
                </div>
            </div>
        </section>

        <!-- Agent Arena View -->
        <section id="view-arena" class="hidden space-y-4 animate-fade-in">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 h-[75vh]">
                <!-- Analytical Logs -->
                <div class="lg:col-span-3 flex flex-col gap-3 overflow-y-auto custom-scrollbar pr-2">
                    <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest px-1 mb-2">Internal Logs</h3>
                    <div id="analyst-reports" class="space-y-3"></div>
                </div>

                <!-- Debate Column -->
                <div class="lg:col-span-6 flex flex-col bg-[#161b22] rounded-xl border border-[#30363d] overflow-hidden">
                    <h3 class="text-[10px] font-bold text-gray-500 uppercase p-3 border-b border-[#30363d]">Adversarial Dialectic: <span id="current-ticker" class="text-green-500 ml-2">---</span></h3>
                    <div id="debate-history" class="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-6">
                        <div class="text-center text-gray-600 italic text-xs mt-20">Initialize a search to start the agentic flow...</div>
                    </div>
                </div>

                <!-- Final Decision Column -->
                <div class="lg:col-span-3 flex flex-col gap-3">
                    <h3 class="text-[10px] font-bold text-gray-500 uppercase px-1 mb-2">Risk Memo</h3>
                    <div id="decision-output" class="bg-green-500/5 border border-green-500/10 rounded-xl p-6 h-full overflow-y-auto custom-scrollbar text-[11px] prose-terminal"></div>
                </div>
            </div>
        </section>

        <!-- Reports View -->
        <section id="view-reports" class="hidden space-y-6 animate-fade-in">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[80vh]">
                <div class="bg-[#161b22] border border-[#30363d] rounded-xl overflow-hidden flex flex-col shadow-2xl">
                    <div class="bg-blue-500/5 p-4 border-b border-blue-500/20 text-blue-400 text-xs font-bold uppercase tracking-wider">XBRL Data Stream</div>
                    <div id="report-xbrl" class="p-8 overflow-y-auto custom-scrollbar prose-terminal text-[11px] flex-1"></div>
                </div>
                <div class="bg-[#161b22] border border-[#30363d] rounded-xl overflow-hidden flex flex-col shadow-2xl">
                    <div class="bg-orange-500/5 p-4 border-b border-orange-500/20 text-orange-400 text-xs font-bold uppercase tracking-wider">Trade Ecosystem</div>
                    <div id="report-ops" class="p-8 overflow-y-auto custom-scrollbar prose-terminal text-[11px] flex-1"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const searchInput = document.getElementById('ticker-search');
        const resultsDiv = document.getElementById('search-results');
        let socket = null;

        function showView(viewId) {
            ['dashboard', 'arena', 'reports'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                document.getElementById(`btn-${v === 'dashboard' ? 'dash' : v}`).classList.remove('active');
            });
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            document.getElementById(`btn-${viewId === 'dashboard' ? 'dash' : viewId}`).classList.add('active');
            if (viewId === 'dashboard') loadHeatmaps();
        }

        async function loadHeatmaps() {
            const res = await fetch('/api/heatmap');
            const data = await res.json();
            if (data.error || !data.index_fig) {
                document.getElementById('heatmap-error').classList.remove('hidden');
                return;
            }
            document.getElementById('heatmap-error').classList.add('hidden');
            const opts = { responsive: true, displayModeBar: false };
            Plotly.newPlot('index-heatmap', data.index_fig.data, data.index_fig.layout, opts);
            Plotly.newPlot('market-heatmap', data.market_fig.data, data.market_fig.layout, opts);
        }

        searchInput.addEventListener('input', async (e) => {
            const q = e.target.value.trim();
            if (q.length < 2) return;
            const res = await fetch(`/api/search?q=${q}`);
            const data = await res.json();
            if (data.quotes) {
                resultsDiv.innerHTML = data.quotes.map(s => `<div class="p-3 hover:bg-[#30363d] cursor-pointer text-xs border-b border-[#30363d]" onclick="startAnalysis('${s.symbol}')"><span class="font-bold text-green-500">${s.symbol}</span> | ${s.shortname}</div>`).join('');
                resultsDiv.classList.remove('hidden');
            }
        });

        function triggerManualSearch() { if (searchInput.value) startAnalysis(searchInput.value); }
        searchInput.addEventListener('keypress', e => e.key==='Enter' && triggerManualSearch());

        function startAnalysis(ticker) {
            resultsDiv.classList.add('hidden');
            searchInput.value = ticker;
            document.getElementById('current-ticker').innerText = ticker.toUpperCase();
            showView('arena');
            
            document.getElementById('analyst-reports').innerHTML = '';
            document.getElementById('debate-history').innerHTML = '';
            document.getElementById('decision-output').innerHTML = '<div class="animate-pulse text-green-500 text-[9px] uppercase tracking-tighter">Cluster Handshake...</div>';
            
            if (socket) socket.close();
            socket = new WebSocket(`${window.location.protocol==='https:'?'wss':'ws'}://${window.location.host}/ws/stream-analysis`);
            socket.onopen = () => socket.send(JSON.stringify({ company: ticker }));
            socket.onmessage = e => {
                const data = JSON.parse(e.data);
                if (data.status === 'completed') return;
                handleEvent(data);
            };
        }

        function handleEvent(data) {
            const node = data.node;
            const update = data.update;

            if (update.fundamentals_report) {
                document.getElementById('report-xbrl').innerHTML = marked.parse(update.fundamentals_report);
                addArenaCard('FUNDAMENTALS', update.fundamentals_report);
            }
            if (update.operations_report) {
                document.getElementById('report-ops').innerHTML = marked.parse(update.operations_report);
                addArenaCard('OPERATIONS', update.operations_report);
            }
            if (update.market_report) addArenaCard('MARKET DATA', update.market_report);
            if (update.news_report) addArenaCard('WORLD AFFAIRS', update.news_report);

            if (node.includes('researcher')) {
                const isBull = node.includes('bull');
                const msg = document.createElement('div');
                msg.className = `p-4 rounded border ${isBull?'bg-green-500/5 border-green-500/10':'bg-red-500/5 border-red-500/10'} animate-fade-in prose-terminal`;
                msg.innerHTML = `<span class="text-[9px] font-bold uppercase ${isBull?'text-green-500':'text-red-500'}">${node.replace('_',' ')}</span><div class="text-[11px] leading-relaxed mt-1">${marked.parse(update.investment_debate_state.current_response)}</div>`;
                const db = document.getElementById('debate-history');
                if (db.innerText.includes('Initialize')) db.innerHTML = '';
                db.appendChild(msg);
                db.scrollTop = db.scrollHeight;
            }

            if (node.includes('risk')) {
                const last = update.risk_debate_state.history.split('\n').pop();
                const msg = document.createElement('div');
                msg.className = "text-[10px] text-blue-400/70 italic p-2 border-l border-blue-500/30 ml-4";
                msg.innerHTML = `🛡️ ${last}`;
                document.getElementById('debate-history').appendChild(msg);
                document.getElementById('debate-history').scrollTop = document.getElementById('debate-history').scrollHeight;
            }

            if (node === 'portfolio_manager') {
                document.getElementById('decision-output').innerHTML = marked.parse(update.final_trade_decision);
            }
        }

        function addArenaCard(title, text) {
            const card = document.createElement('div');
            card.className = 'agent-card p-3 rounded animate-fade-in border-l border-green-500/50 max-h-32 overflow-hidden';
            card.onclick = () => {
                if(card.classList.contains('expanded')) card.classList.remove('expanded');
                else {
                    document.querySelectorAll('.agent-card.expanded').forEach(c => c.classList.remove('expanded'));
                    card.classList.add('expanded');
                }
            };
            card.innerHTML = `<div class="text-[8px] font-bold text-gray-500 uppercase mb-1">${title}</div><div class="text-[10px] text-gray-400 prose-terminal">${marked.parse(text)}</div>`;
            document.getElementById('analyst-reports').prepend(card);
        }

        loadHeatmaps();
    </script>
</body>
</html>
